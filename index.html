:root{

  --brand:#AEB801; --charcoal:#2C2B29;

  color-scheme:dark;

*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:#1C1B19;color:var(--page-fg);font-family:var(--body);font-weight:300;overscroll-behavior:none}
body.light{background:#ECEDE7}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.stage{display:block}

}
.app.light{--bg:#ECEDE7;--surf:#FFFFFF;--line:#D6D7D0;--fg:#2C2B29;--mut:#6E6D67;--acct:#6A7100;border-color:#BDBEB6}

.app.light .lg-w{display:none}.app.light .lg-d{display:block}
.tools{display:flex;gap:6px}
.tool{height:30px;min-width:30px;padding:0 10px;border-radius:15px;border:1px solid var(--line);font-size:11px;font-weight:500;color:var(--mut);display:flex;align-items:center;gap:6px}
.tool b{color:var(--fg);font-weight:600}
.tool svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}

.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:24px;display:none}
.view::-webkit-scrollbar{display:none}
.view.on{display:block;animation:viewIn .42s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateX(calc(14px * var(--d)))}}
.pad{padding:0 18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);font-weight:500}
.app[dir=rtl] .k{letter-spacing:0;font-size:11.5px}
.h{font-family:var(--display);font-style:italic;font-weight:900;font-size:36px;line-height:.92;letter-spacing:-.01em}
.app[dir=rtl] .h{font-family:var(--body);font-style:normal;font-weight:700;font-size:27px;line-height:1.25}
.n{font-family:var(--display);font-style:italic;font-weight:900;font-variant-numeric:tabular-nums;line-height:.85}
.sk{display:inline-block;transform:skewX(-12deg)}
.sk>*{display:inline-block;transform:skewX(12deg)}
.small-note{font-size:11px;color:var(--mut)}

/* ───── Home ───── */
.greet{padding:4px 18px 14px}
.greet .k{display:block;margin-bottom:6px}
.hero{position:relative;height:292px;background:var(--brand);color:#1C1B19;overflow:hidden;clip-path:polygon(0 0,100% 0,100% calc(100% - 66px),0 100%)}
.app[dir=rtl] .hero{clip-path:polygon(0 0,100% 0,100% 100%,0 calc(100% - 66px))}
.hero-txt{position:absolute;inset-inline-start:18px;top:20px;width:47%;display:flex;flex-direction:column;gap:10px;z-index:2}
.hero-txt .k{color:#1C1B19;opacity:.7}
.hero-txt .dl{font-family:var(--display);font-style:italic;font-weight:800;font-size:28px;line-height:.95}
.app[dir=rtl] .hero-txt .dl{font-family:var(--body);font-style:normal;font-weight:700;font-size:21px;line-height:1.25}
.hero-txt p{font-size:12px;line-height:1.4}
.hero-txt p b{font-weight:600}
.renew{align-self:flex-start;background:#1C1B19;color:var(--brand);font-size:12px;font-weight:600;padding:9px 14px;border-radius:5px;margin-top:2px;white-space:nowrap}
.hero-num{position:absolute;inset-inline-end:-46px;top:6px;width:250px;height:250px}
.hero-num svg{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(var(--d))}
.ring{stroke-dasharray:659.7;stroke-dashoffset:659.7;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1) .2s}
.giant{position:absolute;inset:0;display:grid;place-items:center;font-size:250px;color:#1C1B19;padding-right:14px;transform:translateY(8px);transition:opacity .6s .3s,transform .9s cubic-bezier(.2,.8,.2,1) .3s}
.giant.two{font-size:190px}
.app:not(.go) .giant{opacity:0;transform:translateY(30px)}
.live{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut);margin:6px 18px 0;padding:10px 0;border-bottom:1px solid var(--line)}
.live b{color:var(--fg);font-weight:600;white-space:nowrap}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--brand);position:relative;flex:none}
.pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--brand);animation:ping 1.8s ease-out infinite}
.live.closed .pulse{background:var(--mut)}.live.closed .pulse::after{display:none}
@keyframes ping{from{opacity:.8;transform:scale(.6)}to{opacity:0;transform:scale(1.8)}}
.next{margin:14px 18px 0;background:var(--surf);border-radius:16px;padding:16px;position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.next .tag{position:absolute;top:0;inset-inline-start:16px;background:var(--brand);color:#1C1B19;font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px}
.app[dir=rtl] .next .tag{letter-spacing:0;font-size:11px}
.next .cls{padding-top:18px;min-width:0}
.next .cls .n{font-size:36px;overflow-wrap:anywhere}
.next .cls p{font-size:11.5px;color:var(--mut);margin-top:6px}
.next .cd{text-align:end;position:relative;z-index:1;flex:none}
.next .cd .n{font-size:44px;color:var(--acct);display:block;direction:ltr;white-space:nowrap}
.next .cd .n.mid{font-size:32px}
.next .cd small{font-size:10.5px;color:var(--mut)}
.next::after{content:"";position:absolute;inset-inline-end:-58px;bottom:-64px;width:120px;height:120px;opacity:.7;border-radius:50%;border:2px solid var(--line);border-top-color:var(--brand);transform:rotate(calc(var(--prog,0) * 1turn))}
.streak{margin:14px 18px 0;background:var(--surf);border-radius:16px;padding:16px}
.st-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.st-num{display:flex;align-items:flex-end;gap:10px}
.st-num .n{font-size:60px;color:var(--acct);direction:ltr}
.st-num b{font-size:13px;font-weight:600;line-height:1.2;padding-bottom:6px;max-width:9em}
.st-sub{font-size:11.5px;color:var(--mut);margin-top:8px}
.st-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 4px;margin-top:14px;text-align:center}
.st-cal span{font-size:9.5px;font-weight:600;color:var(--mut);letter-spacing:.06em}
.st-cal i{width:24px;height:24px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;color:var(--mut)}
.st-cal i::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--line)}
.st-cal i.on{background:var(--brand);color:#1C1B19}
.st-cal i.on::before{display:none}
.st-cal i.today{box-shadow:inset 0 0 0 1.5px var(--acct)}
.st-cal i.fut::before{opacity:.35}
.mini-freq button:disabled{opacity:.3;cursor:default}
.st-btn{width:100%;margin-top:14px;padding:12px;border-radius:12px;background:var(--brand);color:#1C1B19;font-size:13px;font-weight:700}
.st-done{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--acct)}
.st-done button{font-size:12px;color:var(--mut);text-decoration:underline}
.defi{margin:14px 18px 0;background:var(--surf);border-radius:16px;padding:16px}
.df-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.df-h small{font-size:11px;color:var(--mut);white-space:nowrap}
.df-me{display:flex;align-items:flex-end;gap:10px;margin-top:8px}
.df-me .n{font-size:60px;color:var(--acct);direction:ltr}
.df-me .n sup{font-size:24px;vertical-align:top;margin-inline-start:2px}
.df-me b{font-size:13px;font-weight:600;padding-bottom:6px;line-height:1.3}
.df-gap{font-size:11.5px;color:var(--mut);margin-top:8px}
.df-intro{font-size:12.5px;line-height:1.45;margin-top:8px}
.df-rew{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:600;margin-top:12px;padding:9px 11px;border-radius:10px;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--acct)}
.df-rew svg{flex:none}
.df-list{margin-top:12px;border-top:1px solid var(--line)}
.df-row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.df-row:last-child{border-bottom:0}
.df-row .rk{font-family:var(--display);font-style:italic;font-weight:900;font-size:17px;color:var(--mut)}
.df-row.top .rk{color:var(--acct)}
.df-row.me{background:color-mix(in srgb,var(--brand) 12%,transparent);margin:0 -8px;padding:9px 8px;border-radius:8px;font-weight:600}
.df-row .ct{font-size:11.5px;color:var(--mut)}
.df-dots{text-align:center;color:var(--mut);font-size:13px;letter-spacing:.3em;padding:2px 0}
.df-more{width:100%;padding:12px 0 2px;font-size:12.5px;font-weight:600;color:var(--acct)}
.df-note{font-size:11.5px;color:var(--mut);margin-top:10px}
.df-sheet{max-height:430px;overflow-y:auto;overflow-x:hidden;margin:6px -8px 4px;padding:0 8px;scrollbar-width:thin}
.df-res{font-size:12.5px;line-height:1.4;padding:10px 12px;border-radius:10px;background:var(--surf);color:var(--mut)}
.df-res.ok{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--acct);font-weight:600}
.df-leave{display:block;margin:10px auto 0;font-size:12px;color:var(--mut);text-decoration:underline}
.sec-t{display:flex;justify-content:space-between;align-items:baseline;padding:22px 18px 12px}
.coaches{display:flex;gap:10px;overflow-x:auto;padding:0 18px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.coaches::-webkit-scrollbar{display:none}
.coach{flex:none;width:118px;height:150px;border-radius:12px;background:var(--surf);position:relative;overflow:hidden;scroll-snap-align:start;padding:12px;display:flex;flex-direction:column;justify-content:flex-end}
.coach .mono{position:absolute;inset-inline-end:-8px;top:-18px;font-family:var(--display);font-style:italic;font-weight:900;font-size:140px;line-height:1;color:transparent;-webkit-text-stroke:1.5px var(--line)}
.coach b{font-size:14px;font-weight:600;position:relative}
.coach span{font-size:10.5px;color:var(--mut);position:relative}
.coach i{position:absolute;top:12px;inset-inline-start:12px;font-style:normal;font-size:9px;font-weight:600;background:var(--brand);color:#1C1B19;padding:2px 7px}
.app[dir=rtl] .coach i{font-size:10px}

.rules{margin:22px 18px 0;background:var(--surf);border-radius:16px;padding:16px 16px 6px;position:relative;overflow:hidden}
.rules::before{content:"";position:absolute;top:0;inset-inline-start:0;width:64px;height:4px;background:var(--brand);transform:skewX(-12deg);transform-origin:0 0}
.rules-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rules-h .n{font-size:30px;color:var(--acct)}
.rules-intro{font-size:11.5px;color:var(--mut);margin:6px 0 4px;line-height:1.5}
.rule{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule .ri{width:34px;height:34px;border-radius:9px;background:var(--bg);display:grid;place-items:center}
.rule .ri svg{width:17px;height:17px;stroke:var(--fg);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rule b{display:block;font-size:13px;font-weight:600}
.rule span{display:block;font-size:11.5px;color:var(--mut);line-height:1.45;margin-top:2px}
.rules:not(.open) .rule:nth-child(n+4){display:none}
.rules:not(.open) .rule:nth-child(3){border-bottom:0}
.more{width:100%;padding:10px 0 8px;font-size:12px;font-weight:600;color:var(--acct);border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px}
.more svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .25s}
.rules.open .more svg{transform:rotate(180deg)}

/* ───── Planning ───── */
.seg{display:flex;border:1px solid var(--line);border-radius:22px;padding:3px;font-size:11.5px}
.seg button{padding:6px 12px;border-radius:18px;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--surf);color:var(--fg);font-weight:500;box-shadow:0 1px 0 var(--line)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.days button{padding:9px 0;border-radius:5px;font-size:12px;color:var(--mut);font-weight:500;transition:background .2s,color .2s}
.days button.on{background:var(--brand);color:#1C1B19;transform:skewX(-12deg)}
.days button.on span{display:inline-block;transform:skewX(12deg)}
.days button.today:not(.on){color:var(--fg);box-shadow:inset 0 -2px 0 var(--brand)}
.dayhrs{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);padding-bottom:2px}
.dayhrs b{color:var(--fg);font-weight:500;direction:ltr}
.tracks{position:relative;display:flex;flex-direction:column;gap:18px;padding-top:14px}
.ob .t{display:flex;justify-content:space-between;font-size:12.5px;font-weight:500;margin-bottom:8px}
.ob .t span{color:var(--mut);font-weight:400;font-variant-numeric:tabular-nums;direction:ltr}
.track{height:26px;border-radius:4px;background:var(--surf);position:relative;overflow:visible}
.track .on{position:absolute;top:0;bottom:0;background:var(--brand);border-radius:3px}
.closedlbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mut)}
.axis{position:relative;height:16px;font-size:9.5px;color:var(--mut);direction:ltr;margin-top:8px}
.axis span{position:absolute;transform:translateX(-50%)}
.nowmark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--fg);z-index:2}
.nowmark::before{content:attr(data-t);position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:600;white-space:nowrap}
.tl{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);transition:opacity .3s}
.ev .tm{font-family:var(--display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;direction:ltr;line-height:1.05}
.ev .tm small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.ev .nm{font-size:13px;font-weight:500;min-width:0}
.ev .nm span{display:block;font-size:11px;color:var(--mut);font-weight:300;margin-top:1px}
.ev .nm em{font-style:normal;font-size:9px;font-weight:600;border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-inline-start:6px;color:var(--mut);vertical-align:2px}
.ev.past{opacity:.35}
.ev.cur{background:var(--surf);border:0;border-radius:12px;padding:12px;margin:6px -12px}
.pill{background:var(--brand);color:#1C1B19;font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px}
.app[dir=rtl] .pill{letter-spacing:0;font-size:10.5px}
.bell{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:background .2s,border-color .2s}
.bell svg{width:14px;height:14px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bell.on{background:var(--brand);border-color:var(--brand);animation:ring .5s}
.bell.on svg{stroke:#1C1B19}
@keyframes ring{20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(4deg)}}
.nowline{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;color:var(--acct);padding:4px 0;direction:ltr}
.app[dir=rtl] .nowline{flex-direction:row-reverse}
.nowline::after{content:"";flex:1;height:2px;background:var(--brand)}
.soon{color:var(--acct)!important;font-weight:500!important;display:inline!important}

/* ───── Tarifs ───── */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font-size:11.5px;padding:6px 12px;border-radius:16px;border:1px solid var(--line);color:var(--mut)}
.chips button.on{border-color:var(--fg);color:var(--fg);font-weight:500}
.chips.main button.on{background:var(--fg);color:var(--bg)}
.dur{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.dur button{border:1px solid var(--line);border-radius:7px;padding:11px 0;transform:skewX(-12deg);transition:background .2s,border-color .2s}
.dur button>span{display:flex;flex-direction:column;gap:3px;transform:skewX(12deg)}
.dur b{font-family:var(--display);font-style:italic;font-weight:800;font-size:19px;line-height:1}
.app[dir=rtl] .dur b{font-family:var(--body);font-style:normal;font-weight:600;font-size:13px}
.dur small{font-size:10px;color:var(--mut);font-variant-numeric:tabular-nums}
.dur button.on{background:var(--brand);border-color:var(--brand);color:#1C1B19}
.dur button.on small{color:#1C1B19;opacity:.75}
.price{position:relative;height:178px;border-radius:16px;background:var(--surf);overflow:hidden;padding:16px}
.price .info{position:relative;z-index:1;display:flex;flex-direction:column;gap:6px;font-size:12px;max-width:44%}
.price .info s{color:var(--mut)}
.price .info b{color:var(--acct);font-weight:600}
.price .info span{color:var(--mut);font-size:11px}
.price .cur{position:absolute;inset-inline-end:14px;top:14px;font-family:var(--display);font-weight:700;font-size:18px;color:var(--mut)}
.price .big{position:absolute;inset-inline-end:-4px;bottom:-16px;font-size:128px;color:var(--fg);direction:ltr}
.price .big.four{font-size:96px;bottom:-10px}
.app[dir=rtl] .price .big{right:auto;left:-4px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:52px 1fr 56px;gap:10px;align-items:center;font-size:11px;color:var(--mut)}
.bar i{display:block;height:10px;border-radius:2px;background:var(--line);transition:width .5s cubic-bezier(.2,.8,.2,1),background .2s}
.bar.on{color:var(--fg)}.bar.on i{background:var(--brand)}
.bar span:last-child{text-align:end;font-variant-numeric:tabular-nums}
.cta{width:100%;height:50px;border-radius:8px;background:var(--brand);color:#1C1B19;font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.cta svg{width:16px;height:16px;fill:#1C1B19}
.ctanote{text-align:center;font-size:11px;color:var(--mut);direction:ltr}

/* ───── Progrès ───── */
.wbig{display:flex;justify-content:space-between;align-items:flex-end}
.wbig .n{font-size:64px}
.wbig .n small{font-size:20px;font-style:normal;font-weight:700;margin-inline-start:3px}
.wd{text-align:end;font-size:12px;font-weight:500}
.wd.good{color:var(--acct)}.wd.neutral{color:var(--mut)}
.wd span{display:block;color:var(--mut);font-weight:300;font-size:11px}
.spark{display:block;width:100%;height:auto;overflow:visible}
.spark .ln{stroke-dasharray:700;stroke-dashoffset:700}
.spark.draw .ln{stroke-dashoffset:0;transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1)}
.spark .ar{opacity:0}.spark.draw .ar{opacity:1;transition:opacity .6s .7s}
.spark .end{opacity:0}.spark.draw .end{opacity:1;transition:opacity .3s 1.1s}
.mon{direction:ltr;display:grid;grid-template-columns:repeat(6,1fr);text-align:center;font-size:10px;color:var(--mut);margin-top:4px}
.imc{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surf);border-radius:12px;padding:12px 14px;font-size:12px}
.imc .n{font-size:28px;margin-inline-end:8px}
.imc .scale{width:100px;flex:none;height:6px;border-radius:3px;background:linear-gradient(90deg,#6E9BC9 0 17.5%,var(--brand) 17.5% 50%,#D9A13B 50% 75%,#C9583E 75%);position:relative;direction:ltr}
.imc .scale i{position:absolute;top:-4px;width:3px;height:14px;background:var(--fg);border-radius:1px;transition:left .5s cubic-bezier(.2,.8,.2,1)}
.add{font-size:11.5px;font-weight:600;color:var(--acct);padding:4px 0}
.rec{display:grid;grid-template-columns:1fr auto 52px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rec .nm{font-size:13px;font-weight:500}
.rec .nm span{display:block;font-size:11px;color:var(--mut);font-weight:300}
.rec .n{font-size:34px;direction:ltr}
.rec .n small{font-size:13px;font-style:normal;font-weight:700}
.chip{font-size:11px;font-weight:600;text-align:center;padding:4px 0;transform:skewX(-12deg);border-radius:3px;direction:ltr}
.chip.up{background:color-mix(in srgb,var(--brand) 22%,transparent);color:var(--acct)}
.chip.eq{background:var(--surf);color:var(--mut)}
.chip.new{background:var(--brand);color:#1C1B19}

/* ───── Profil ───── */
.mcard{position:relative;border-radius:16px;background:#2C2B29;color:#F1F1EC;padding:16px;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.mcard::before{content:"";position:absolute;top:0;bottom:0;inset-inline-end:-40px;width:120px;background:var(--brand);transform:skewX(-12deg)}
.mcard>*{position:relative}
.mc-top{display:flex;justify-content:space-between;align-items:center}
.mc-top img{height:20px}
.mc-badge{font-size:9.5px;font-weight:700;letter-spacing:.14em;color:var(--brand);background:#1C1B19;padding:4px 9px;border-radius:3px}
.app[dir=rtl] .mc-badge{letter-spacing:0;font-size:11px}
.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:72%}
.mc-grid span{display:block;font-size:9.5px;color:#9B9A93;letter-spacing:.08em;text-transform:uppercase}
.app[dir=rtl] .mc-grid span{letter-spacing:0;font-size:10.5px}
.mc-grid b{font-size:13px;font-weight:600}
.mc-grid b.ok{color:var(--brand)}
.bc{background:#F1F1EC;border-radius:8px;padding:8px 10px 6px;text-align:center}
.bc svg{display:block;width:100%;height:34px}
.bc small{font-size:10px;color:#2C2B29;letter-spacing:.2em;font-weight:600;direction:ltr;display:block;margin-top:3px}
.tgl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:13px;width:100%;text-align:start}
.tgl small{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .2s}

/* ───── Sheets ───── */

.dots{display:flex;gap:18px;justify-content:center;margin:22px 0 4px;direction:ltr}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);transition:background .15s,border-color .15s}

@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.err.center{text-align:center}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr;margin-top:6px}

.blk{margin:22px 18px 0;display:flex;flex-direction:column;gap:10px}
.news{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;background:var(--surf);border-radius:14px;padding:14px}
.news .ni{width:40px;height:40px;border-radius:10px;background:var(--bg);display:grid;place-items:center}
.news .ni svg{width:19px;height:19px;stroke:var(--fg);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.news b{display:block;font-size:13.5px;font-weight:600}
.news span{display:block;font-size:12px;color:var(--mut);line-height:1.45;margin-top:2px}
.news.promo{background:var(--brand);color:#1C1B19}
.news.promo span{color:#1C1B19;opacity:.8}
.news.promo .ni{background:#1C1B19}.news.promo .ni svg{stroke:var(--brand)}
.news em{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:3px;background:#1C1B19;color:var(--brand);margin-inline-start:6px;vertical-align:1px}
.salle{background:var(--surf);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.salle-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.salle-h b{font-family:var(--display);font-style:italic;font-weight:900;font-size:26px;line-height:1}
.app[dir=rtl] .salle-h b{font-family:var(--body);font-style:normal;font-weight:700;font-size:20px}
.salle-h span{display:block;font-size:11.5px;color:var(--mut);margin-top:4px}
.stat{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:12px;white-space:nowrap;background:var(--bg);color:var(--mut)}
.stat.open{background:color-mix(in srgb,var(--brand) 22%,transparent);color:var(--acct)}
.hrow{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:8px 0;border-top:1px solid var(--line)}
.hrow span:last-child{color:var(--mut);text-align:end;line-height:1.55;white-space:nowrap}
.hrow i{font-style:normal;color:#E06A55}
.app.light .hrow i{color:#B4412F}
.sbtns{display:grid;grid-template-columns:1fr auto;gap:8px}
.sbtns a{height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;font-weight:600;text-decoration:none}
.sbtns a.wa{background:var(--brand);color:#1C1B19}
.sbtns a.wa svg{width:15px;height:15px;fill:#1C1B19}
.sbtns a.mp{border:1px solid var(--line);color:var(--fg);padding:0 16px}
.sbtns a.mp svg{width:15px;height:15px;stroke:var(--fg);fill:none;stroke-width:2}
.pchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.pchips::-webkit-scrollbar{display:none}
.pchips span,.pchips a{flex:none;font-size:12px;padding:8px 12px;border-radius:10px;background:var(--surf);color:var(--fg);text-decoration:none;font-weight:500}
.pchips small{display:block;font-size:10px;color:var(--mut);font-weight:400}
.pchips .pl{display:flex;align-items:center;gap:9px}
.pchips img{width:34px;height:34px;object-fit:contain;border-radius:8px;background:#fff;padding:2px;flex:none}
.calc{background:var(--surf);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.calc-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.calc-top .n{font-size:44px}
.calc-top small{font-size:14px;font-style:normal;font-weight:700;color:var(--mut);margin-inline-start:4px}
.calc-top span{font-size:11.5px;color:var(--mut);text-align:end}
.calc .chips button{font-size:11px;padding:6px 10px}
.calc .chips button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.macros div{background:var(--bg);border-radius:10px;padding:10px 6px;text-align:center}
.macros .n{font-size:24px;display:block;direction:ltr}
.macros span{font-size:10.5px;color:var(--mut)}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.info-row span:last-child{color:var(--mut);display:flex;align-items:center;gap:6px}
.info-row svg{width:13px;height:13px;stroke:var(--mut);fill:none;stroke-width:2}
.mini-freq{display:flex;align-items:center;gap:12px;direction:ltr}
.info-edit{width:100%;text-align:start;color:inherit}
.info-edit .ed-arr{font-style:normal;color:var(--mut);margin-inline-start:8px;display:inline-block;transform:scaleX(var(--d))}
.mini-sex{display:flex;gap:6px}
.mini-sex button{padding:7px 12px;border-radius:9px;border:1px solid var(--line);font-size:12px}
.mini-sex button.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.mini-freq button{width:36px;height:36px;border-radius:9px;background:var(--surf);font-family:var(--display);font-weight:800;font-size:20px}
.mini-freq .n{font-size:28px;min-width:20px;text-align:center}
.links a{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--fg);text-decoration:none}
.links a span:last-child{color:var(--mut);font-size:12px;direction:ltr;unicode-bidi:isolate}
.recov{display:flex;flex-direction:column}
.recov div{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}
.recov div:last-child{border-bottom:0}
.recov .ri{width:34px;height:34px;border-radius:9px;background:var(--surf);display:grid;place-items:center}
.recov .ri svg{width:16px;height:16px;stroke:var(--fg);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.recov b{display:block;font-size:13px;font-weight:600}
.recov span{font-size:11.5px;color:var(--mut)}
.demo-btn{align-self:flex-start;font-size:12px;color:var(--page-mut);border:1px solid var(--page-line);border-radius:16px;padding:5px 12px}


/* ───── Mode gestion ───── */
.adel{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);color:var(--mut);font-size:17px;display:grid;place-items:center;flex:none}
.inp.tp{width:96px;height:40px;text-align:center;padding:0 8px;direction:ltr}
.chk{display:flex;align-items:center;gap:10px;font-size:13px}
.chk input{width:20px;height:20px;accent-color:#AEB801}
.adm-btns{display:flex;gap:6px;flex:none}
.stitem.editing{box-shadow:inset 0 0 0 1.5px var(--acct)}
.adm-arr{display:inline-block;font-size:18px;color:var(--mut);transform:scaleX(var(--d))}

/* ───── Nav ───── */
.nav{height:70px;flex:none;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);position:relative;padding-bottom:10px;background:var(--bg)}
.ind{position:absolute;top:9px;inset-inline-start:0;width:20%;height:30px;display:grid;place-items:center;transform:translateX(calc(var(--i,0) * 100% * var(--d)));transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.ind::before{content:"";width:48px;height:30px;background:var(--brand);border-radius:5px;transform:skewX(-12deg)}
.nb{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:12px;font-size:9.5px;font-weight:500;color:var(--mut);position:relative;z-index:1;transition:color .2s}
.nb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.nb.on{color:var(--fg)}
.nb.on svg{stroke:#1C1B19}

/* ───── Splash ───── */
.splash{position:absolute;inset:0;z-index:50;background:#1C1B19;display:flex;flex-direction:column;overflow:hidden;transition:opacity .5s,transform .6s cubic-bezier(.7,0,.3,1)}
.splash.gone{opacity:0;transform:scale(1.04);pointer-events:none}
.sp-slab{position:absolute;top:0;left:0;right:0;height:18%;background:#AEB801;clip-path:polygon(0 0,100% 0,100% calc(100% - 46px),0 100%);animation:spSlab .7s cubic-bezier(.2,.8,.2,1) both}
.sp-bottom{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding-top:34px} /* le décalage compense la ligne Moknine : le logo reste au centre exact */
.sp-logo{width:min(250px,70%);height:auto;overflow:visible;animation:spUp .5s cubic-bezier(.2,.8,.2,1) .2s both}
.sp-arrow{transform-box:view-box;transform-origin:191px 185px;animation:spOrbit .95s cubic-bezier(.3,.6,.25,1.04) .3s both}
.sp-arrow use{animation:spFade .2s linear .3s both}
.sp-bottom small{font-size:10.5px;letter-spacing:.34em;color:#8E8D86;text-transform:uppercase;animation:spUp .6s cubic-bezier(.2,.8,.2,1) .5s both}
@keyframes spSlab{from{transform:translateY(-100%)}}
@keyframes spOrbit{from{transform:rotate(-360deg)}}
@keyframes spFade{from{opacity:0}}
@keyframes spUp{from{opacity:0;transform:translateY(12px)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style>
</head>

<script>
/* ── Données : appels à Supabase (fonctions fl_* des phases 0 et 1) et conversion vers l'état de l'app ── */
const FL_URL = 'https://goukcdzjzaokrqggpzqu.supabase.co', FL_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvdWtjZHpqemFva3JxZ2dwenF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMDYyNjcsImV4cCI6MjA5MjU4MjI2N30.UUQabgwtZSu6CY9tX2t9djyZ5Z84gQYcCbTnO5I0KKs';

// Stockage local protégé (navigation privée, stockage bloqué : l'app continue sans)
const flStore = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

// Appel d'une fonction ; ne lève jamais : { status:'network' } sans réseau, { status:'server' } si la base répond une erreur
async function flRpc(fn, params) {
  try {
    const r = await fetch(FL_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { apikey: FL_KEY, Authorization: 'Bearer ' + FL_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(params || {})
    });
    if (!r.ok) return { status: 'server', code: r.status };
    return await r.json();
  } catch (e) { return { status: 'network' }; }
}
function isNetErr(r) { return !r || r.status === 'network' || r.status === 'server'; }

// « 2x » … « 6x », « 4x+ » → nombre de séances par semaine (3 par défaut)
function freqNum(f) { const n = parseInt(String(f == null ? '' : f).replace(/\D/g, ''), 10); return n >= 2 && n <= 6 ? n : 3; }
function freqTxt(n) { return n + 'x'; }
// Numéro de membre permanent : 12 → « FL-0012 »
function memberId(n) { return n ? 'FL-' + String(n).padStart(4, '0') : '—'; }

// Courbe de poids : jusqu'aux 6 derniers mois, le dernier = mois en cours ; un mois sans pesée reprend la valeur précédente
function poidsSerie(poids, fallback, now) {
  const key = (m, y) => y * 12 + m, win = [];
  for (let k = 5; k >= 0; k--) { const d = new Date(now.getFullYear(), now.getMonth() - k, 1); win.push([d.getMonth(), d.getFullYear()]); }
  const list = (poids || []).map(p => ({ k: key(+p.mois, +p.annee), v: +p.poids })).filter(p => p.v > 0).sort((a, b) => a.k - b.k);
  const byKey = new Map(list.map(p => [p.k, p.v]));
  const before = list.filter(p => p.k < key(win[0][0], win[0][1]));
  let prev = before.length ? before[before.length - 1].v : null;
  const W = [], months = [];
  for (const [m, y] of win) {
    if (byKey.has(key(m, y))) prev = byKey.get(key(m, y));
    if (prev != null) { W.push(prev); months.push([m, y]); }
  }
  if (!W.length) return { W: [+fallback > 0 ? +fallback : 70], months: [win[5]] };
  return { W, months };
}

// Données du membre (fl_login, fl_me…) → objet membre utilisé par l'app
function fromPayload(p, exNames, now) {
  const u = (p && p.user) || {}, s = poidsSerie(p && p.poids, u.poids, now);
  const ch = new Map(((p && p.charges) || []).map(c => [c.exercice, c]));
  return {
    phone: u.phone || '', name: u.name || '', dob: u.dob || '', sexe: u.sexe || '', taille: u.taille || null,
    objectif: u.objectif || '', niveau: u.niveau || '', freq: freqNum(u.frequence), role: (p && p.role) || null,
    abo: u.abo_start ? { start: String(u.abo_start).slice(0, 10), dur: +u.abo_dur || 1, type: u.abo_type || 'acces-total', src: 'salle' } : null,
    W: s.W, Wm: s.months,
    REC: exNames.map(n => { const c = ch.get(n); return c ? { kg: +c.kg, prev: c.prev_kg == null ? null : +c.prev_kg } : null; }),
    days: ((p && p.jours) || []).map(d => String(d).slice(0, 10)),
    done: +(p && p.nb_seances) || 0, memberNo: +(p && p.member_no) || null, defi: !!(p && p.defi), defiMois: +(p && p.defi_mois) || 0,
    notifs: [u.notif_cours !== false, u.notif_abo !== false, u.notif_anniv !== false]
  };
}

// Contenu de la salle (fl_contenu) → coachs, planning, tarifs, annonces, horaires, défi
function fromContenu(c) {
  c = c || {};
  const coaches = (c.coachs || []).map(x => [x.nom, x.nom_ar || x.nom, x.salle, x.spec || '', x.spec_ar || x.spec || '', x.id]);
  const plan = {}; for (let d = 0; d < 7; d++) plan[d] = [];
  for (const x of c.planning || []) if (plan[x.jour]) plan[x.jour].push([x.heure, x.fin || null, x.cours, x.coach || '', x.tag || null, x.id]);
  const prices = {};
  for (const x of c.tarifs || []) (prices[x.offre] = prices[x.offre] || {})[x.sous] = (x.prix || []).map(Number);

/* ── Abonnement ── */
function aboInfo(){return ABO?aboCalc(ABO):null;}
function aboCalc(abo){
  const st=new Date(abo.start+'T00:00:00');
  const end=new Date(st);end.setMonth(end.getMonth()+abo.dur);
  const total=Math.round((end-st)/864e5);
  const left=Math.ceil((end-now())/864e5);
  return {end,total,left};
}
function dayWord(n){if(lang!=='ar')return n+' j';return n===1?'يوم واحد':n===2?'يومان':n<=10?n+' أيام':n+' يومًا';}
function fmtDate(d){return d.getDate()+' '+t('months')[d.getMonth()];}

/* ── Statut d'ouverture Salle 1 ── */
function liveStatus(){
  const d=now().getDay(),h=nowH(),H=HRS.h(d),F=HRS.f(d);
  const hOpen=h>=H[0]&&h<H[1],fOpen=F&&h>=F[0]&&h<F[1];
  if(hOpen||fOpen){
    const parts=[];
    parts.push(hOpen?fmt(t('until'),{who:t('H'),h:hm(H[1])}):'');
    parts.push(fOpen?fmt(t('until'),{who:t('F'),h:hm(F[1])}):t('fClosed'));
    return {open:true,text:t('S1')+' · '+parts.filter(Boolean).join(' · ')};
  }
  if(h<H[0])return {open:false,text:t('S1')+' · '+fmt(t('opensAt'),{h:hm(H[0])})};
  return {open:false,text:t('S1')+' · '+fmt(t('opensTom'),{h:hm(HRS.h((d+1)%7)[0])})};
}

/* ── Prochain cours adulte ── */
function nextClass(){
  const n=now();
  for(let k=0;k<8;k++){
    const day=new Date(n.getFullYear(),n.getMonth(),n.getDate()+k),dow=day.getDay();
    for(const c of PLAN[dow]){
      if(c[4])continue;
      const [hh,mm]=c[0].split(':').map(Number);
      const st=new Date(day.getFullYear(),day.getMonth(),day.getDate(),hh,mm);
      if(st>n)return {c,st,k,dow};
    }
  }
  return null;
}

    const coach=c[3]?(lang==='ar'?coachAr(c[3]):c[3]):'';

    if(isToday&&state===''&&!nextDone){nextDone=true;const m=Math.round((st-h)*60);const soon=m<60?fmt(t('inMin'),{m}):fmt(t('inH'),{h:Math.floor(m/60),m:String(m%60).padStart(2,'0')});sub=(coach?esc(coach)+' · ':'')+'<span class="soon">'+soon+'</span>';}

function renderTarifs(instant){
  document.getElementById('offer').innerHTML=Object.keys(PRICES).map(o=>'<button class="'+(o===offer?'on':'')+'" data-o="'+o+'">'+t('offers')[o]+'</button>').join('');
  const f=document.getElementById('formula');f.hidden=!SUB[offer].length;

  const p=PRICES[offer][sub],months=[1,3,6,12];
  document.getElementById('dur').innerHTML=t('dur').map((d,i)=>'<button class="'+(i===dur?'on':'')+'" data-u="'+i+'"><span><b>'+d+'</b><small>'+p[i]+'</small></span></button>').join('');
  const price=p[dur],base=p[0]*months[dur],saved=base-price;
  document.getElementById('pOld').textContent=saved>0?base+' '+t('cur'):t('base');
  document.getElementById('pSave').textContent=saved>0?fmt(t('saveX'),{x:saved}):(offer==='fit'?t('fitNote'):'');
  document.getElementById('pMonth').textContent=dur>0?fmt(t('month'),{x:Math.round(price/months[dur])}):'';
  document.getElementById('bars').innerHTML=months.map((m,i)=>{const v=p[i]/m;return '<div class="bar'+(i===dur?' on':'')+'"><span>'+t('dur')[i]+'</span><i style="width:'+(v/p[0]*100).toFixed(1)+'%"></i><span>'+Math.round(v)+' '+t('cur')+'</span></div>';}).join('');
  document.getElementById('ctaNote').textContent=fmt(t('ctaNote'),{p:PHONE[offer]});
  document.getElementById('pBig').classList.toggle('four',price>=1000);
  rollTo(price,instant);
}
function rollTo(v,instant){
  const el=document.getElementById('pBig');
  if(instant||matchMedia('(prefers-reduced-motion: reduce)').matches){shown=v;el.textContent=v;return;}
  const from=shown,st=performance.now(),d=450;
  (function f(n){const k=Math.min(1,(n-st)/d),e=1-Math.pow(1-k,3);el.textContent=Math.round(from+(v-from)*e);if(k<1)requestAnimationFrame(f);else shown=v;})(st);
}

function monthAgo(k){const n=now();return new Date(n.getFullYear(),n.getMonth()-k,1).getMonth();}
function renderProg(animate){
  if(!W.length)return;
  const last=W[W.length-1],one=W.length<2,delta=one?0:last-W[0];
  document.getElementById('wNow').textContent=f1(last);

  else{
    const good=(OBJECTIF==='perte'&&delta<0)||(OBJECTIF==='masse'&&delta>0);
    wd.className='wd '+(good?'good':'neutral');
    wd.innerHTML=(delta<0?'−':delta>0?'+':'')+f1(Math.abs(delta))+' '+t('kg')+'<span>'+fmt(t('since'),{m:t('months')[monthAgo(W.length-1)]})+'</span>';
  }
  document.getElementById('months').innerHTML=[5,4,3,2,1,0].map(k=>'<span>'+t('mShort')[monthAgo(k)]+'</span>').join('');
  const mn=one?last-1:Math.min(...W)-.3,mx=one?last+1:Math.max(...W)+.3;
  const pts=W.map((v,i)=>[8+(6-W.length+i)*65.6,10+(mx-v)/(mx-mn)*70]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  document.getElementById('spL').setAttribute('d',one?'':d);

  const e=pts[pts.length-1],c=document.getElementById('spE');c.setAttribute('cx',e[0]);c.setAttribute('cy',e[1].toFixed(1));
  const imc=last/(TAILLE*TAILLE);
  document.getElementById('imcV').textContent=f1(imc);
  document.getElementById('imcT').textContent=t('imcCat')[imc<18.5?0:imc<25?1:imc<30?2:3];
  document.getElementById('imcM').style.left=Math.max(0,Math.min(98,(imc-15)/20*100))+'%';
  document.getElementById('recs').innerHTML=REC.every(r=>!r)?'<p class="sub" style="padding:10px 0">'+t('noRecs')+'</p>':REC.map((r,i)=>{

  }).join('');
  if(animate){const s=document.getElementById('spark');s.classList.remove('draw');void s.getBoundingClientRect();requestAnimationFrame(()=>s.classList.add('draw'));}

function makeRuler(id,tid,min,max,step,onv){
  const el=$(id),tk=$(tid),px=8,n=Math.round((max-min)/step);
  tk.style.width=(n*px)+'px';
  let lbl='';for(let i=0;i<=n;i+=10)lbl+='<span style="left:'+(i*px)+'px">'+fr(+(min+i*step).toFixed(1))+'</span>';
  tk.innerHTML=lbl;
  let tmr,dr=null;
  const read=()=>Math.min(max,Math.max(min,+(min+Math.round(el.scrollLeft/px)*step).toFixed(1)));
  el.addEventListener('scroll',()=>{if(!el.offsetParent)return;onv(read());clearTimeout(tmr);tmr=setTimeout(()=>{const x=Math.round(el.scrollLeft/px)*px;if(Math.abs(x-el.scrollLeft)>.5)el.scrollTo({left:x,behavior:'smooth'});},140);});
  el.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;dr={x:e.clientX,s:el.scrollLeft};el.setPointerCapture(e.pointerId);});
  el.addEventListener('pointermove',e=>{if(dr)el.scrollLeft=dr.s-(e.clientX-dr.x);});
  el.addEventListener('pointerup',()=>{dr=null;});
  return {set(v){el.scrollTo({left:(v-min)/step*px,behavior:'instant'});onv(v);}};
}

// Envoie une écriture du membre. Sans réseau : gardée (avec sa date) et renvoyée plus tard. Renvoie la réponse de la base.
async function flSend(fn,params,quiet){
  const r=await flMe(fn,params);
  if(isNetErr(r)){const q=flStore.get('fl_queue')||[];q.push({fn,params,day:iso(now()),phone:CUR});flStore.set('fl_queue',q);if(!quiet)toast(t('savedLater'));}
  else if(r&&r.status!=='ok'&&r.status!=='invalid_session'&&!quiet)toast(t('saveErr'));
  return r;
}
// Renvoi des écritures gardées (« aujourd'hui » coché seulement le jour même)
async function flFlush(){
  const q=flStore.get('fl_queue')||[];if(!q.length||!flToken())return;
  // Chaque écriture n'est envoyée qu'avec la session de son propre membre (téléphone partagé : rien ne part sur un autre compte)
  const mine=q.filter(it=>it.phone===CUR),others=q.filter(it=>it.phone!==CUR);
  let i=0;
  for(;i<mine.length;i++){
    const it=mine[i];if(it.fn==='fl_mark_today'&&it.day!==iso(now()))continue;
    const r=await flMe(it.fn,it.params);if(isNetErr(r))break;   // toujours pas de réseau : on garde la suite
  }
  flStore.set('fl_queue',others.concat(mine.slice(i)));
}

// Abonnement push enregistré dans la base (fl_save_profile) quand il change
async function flPush(){
  if(!notifOk()||!('PushManager' in window)||!CUR)return;
  try{
    const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
    if(sub&&flStore.get('fl_vapid')!==VAPID_VERSION){await sub.unsubscribe();sub=null;}
    if(!sub){sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(VAPID_KEY)});flStore.set('fl_vapid',VAPID_VERSION);}
    const tok=JSON.stringify(sub);
    if(flStore.get('fl_push_'+CUR)!==tok){const r=await flSend('fl_save_profile',{p:{push_token:tok}},true);if(r&&r.status==='ok')flStore.set('fl_push_'+CUR,tok);}
  }catch(e){}
}
async function askNotif(){
  if(!('Notification' in window))return false;
  if(Notification.permission==='default'){try{await Notification.requestPermission();}catch(e){}}
  const on=Notification.permission==='granted';if(on){flPush();flScheduleNotifs();}
  return on;
}

$('onb').addEventListener('click',e=>{
  const b=e.target.closest('[data-o],[data-k],[data-goal],[data-lv],[data-sex],[data-f],[data-os]');if(!b||b.disabled)return;
  if(b.dataset.k)return pinKey(b.dataset.k);
  if(b.dataset.goal){draft.objectif=b.dataset.goal;renderOnb();setTimeout(()=>{if(curOs==='o-q1')oGo('o-q2');},260);return;}
  if(b.dataset.lv){draft.niveau=b.dataset.lv;renderOnb();setTimeout(()=>{if(curOs==='o-q2')oGo('o-q3');},260);return;}
  if(b.dataset.sex){draft.sexe=b.dataset.sex;document.querySelectorAll('#fSex button').forEach(x=>x.classList.toggle('on',x===b));$('eSex').textContent='';return;}
  if(b.dataset.f){draft.freq=Math.min(6,Math.max(2,(draft.freq||3)+(+b.dataset.f)));renderOnb();return;}
  if(b.dataset.os){instOs=b.dataset.os;renderOnb();return;}
  const o=b.dataset.o;
  if(o==='new'){
    const keep=flow==='login'?digits($('fLogin').value):'';
    flow='reg';draft={freq:3};osStack=['o-welcome'];
    $('fName').value='';$('fPhone').value=fmtPhone(keep);['eName','ePhone','eDob','eSex'].forEach(x=>$(x).textContent='');
    $('fDob').value='';document.querySelectorAll('#fSex button').forEach(x=>x.classList.remove('on'));
    oGo('o-reg1',false);return;
  }
  if(o==='old'||o==='toLogin'){
    const keep=o==='toLogin'?digits($('fPhone').value):'';
    flow='login';osStack=['o-welcome'];$('fLogin').value=fmtPhone(keep);$('eLogin').textContent='';oGo('o-login',false);return;
  }
  if(o==='r1'){
    const name=$('fName').value.trim(),ph=digits($('fPhone').value);let ok=true;
    if(name.replace(/\s/g,'').length<3){$('eName').textContent=t('errName');ok=false;}else $('eName').textContent='';
    if(ph.length!==8){$('ePhone').textContent=t('errPhone');ok=false;}
    else $('ePhone').textContent='';
    if(!ok)return;draft.name=name;draft.phone=ph;oGo('o-reg2');return;
  }
  if(o==='r2'){
    const dob=$('fDob').value;let ok=true;
    if(!dob){$('eDob').textContent=t('errDob');ok=false;}else $('eDob').textContent='';
    if(!draft.sexe){$('eSex').textContent=t('errSex');ok=false;}
    if(!ok)return;draft.dob=dob;pinMode='reg1';pinBuf='';oGo('o-pin');return;
  }
  if(o==='stSave'){
    if(!validForm('staff'))return;const fm=FORMS.staff,btn=$('stSaveBtn');btn.disabled=true;
    flMe('fl_staff_set_abo',{p_pin:STAFF_PIN,p_start:fm.start,p_dur:fm.dur,p_type:fm.type}).then(r=>{
      btn.disabled=false;
      if(r&&r.status==='ok'){flStore.set(CACHE_ME,Object.assign(flStore.get(CACHE_ME)||{},r));const ph=applyMe(r);ABO=ACCOUNTS[ph].abo;STAFF_PIN=null;closeDesk();toast(t('deskSaved'));flScheduleNotifs();return;}
      const e=$('fa-staff-e');if(!e||r&&r.status==='invalid_session')return;
      e.textContent=r&&r.status==='locked'?lockMsg(r):r&&r.status==='bad_staff_pin'?fmt(t('errCode'),{n:r.left}):r&&r.status==='bad_value'?t('errStart'):t(isNetErr(r)?'netErr':'saveErr');
    });
    return;
  }
  if(admAction(o))return;
  if(o==='q3'){oGo('o-install');return;}
  if(o==='inst'){oGo('o-notif');return;}
  if(o==='notifYes'){askNotif().then(on=>{toggles=[on,on,on];finishReg();if(on)setTimeout(()=>toast(t('notOn')),2400);});return;}
  if(o==='sysYes'){$('sys').hidden=true;toggles=[true,true,true];finishReg();setTimeout(()=>toast(t('notOn')),2400);return;}
  if(o==='sysNo'){$('sys').hidden=true;toggles=[false,false,false];finishReg();return;}
  if(o==='notifLater'){finishReg();return;}
  if(o==='login'){
    const ph=digits($('fLogin').value);
    if(ph.length!==8){$('eLogin').textContent=t('errPhone');return;}
    $('eLogin').textContent='';loginPhone=ph;
    // On demande d'abord à la base si ce numéro a déjà un code : sinon, on passe directement à la date de naissance
    if(loginBusy)return;loginBusy=true;
    flRpc('fl_phone_status',{p_phone:ph}).then(r=>{
      loginBusy=false;
      if(loginPhone!==ph||curOs!=='o-login')return;
      if(r&&r.status==='not_found'){$('eLogin').innerHTML=t('errUnknown')+'<button data-o="new">'+t('createInstead')+'</button>';return;}
      if(r&&r.status==='pin_not_set'){pinMode='';pinBuf='';$('fClaimDob').value='';$('eClaim').textContent='';oGo('o-claim');return;}
      if(r&&r.status==='locked'){$('eLogin').textContent=lockMsg(r);return;}
      pinMode='login';pinBuf='';oGo('o-pin');   // code déjà créé, ou base injoignable : la saisie du code gère la suite
    });
    return;
  }
  if(o==='changeNum'){osStack.pop();pinMode='';oGo('o-login',false);return;}
  if(o==='claim'){
    const dob=$('fClaimDob').value;
    if(!dob){$('eClaim').textContent=t('errDob');return;}
    claimDob=dob;$('eClaim').textContent='';pinMode='claim1';pinBuf='';oGo('o-pin');return;
  }
});

function openAdmin(){const a=ACCOUNTS[CUR];if(!a||a.role!=='owner')return;closeSheets();admFrom='app';flow='admin';osStack=[];pinMode='';pinBuf='';$('onb').hidden=false;oGo('o-admin',false);}
function closeAdmin(){flow='';pinMode='';pinBuf='';if(admFrom==='app'){$('onb').hidden=true;renderHome();renderPlan();renderTarifs(true);setNotes();}else oGo('o-welcome',false);renderExtras();}
$('onb').addEventListener('click',e=>{
  const b=e.target.closest('[data-del],[data-pdel],[data-ad2],[data-ao],[data-as],[data-at2]');if(!b)return;
  if(b.dataset.del){flAdmin('fl_admin_annonce_del',{p_id:+b.dataset.del},'annDeleted');}
  else if(b.dataset.pdel!==undefined){const row=PLAN[admDay][+b.dataset.pdel];if(row&&row[5])flAdmin('fl_admin_planning_del',{p_id:row[5]},'planDeleted');}
  else if(b.dataset.ad2){admDay=+b.dataset.ad2;renderAdmin();}
  else if(b.dataset.ao){admOffer=b.dataset.ao;admSub=SUB[admOffer][0]||'_';$('eTar').textContent='';renderAdmin();}
  else if(b.dataset.as){admSub=b.dataset.as;$('eTar').textContent='';renderAdmin();}
  else if(b.dataset.at2){annType=b.dataset.at2;if(annType==='promo'&&!$('annE').value)$('annE').value=isoIn(14);renderAdmin();}
});
// Enregistrement côté base : message d'erreur précis, puis contenu rechargé chez tout le monde
const ADM_ERR={forbidden:'admForbidden',duplicate:'errCoachDup',no_name:'errCoach',weak:'errCodeWeak',same:'errCodeSame',bad_pin_format:'errCode4',past_end:'errAnnEnd',no_title:'errAnn'};
async function flAdmin(fn,params,okMsg,errId){
  const r=await flMe(fn,params);
  if(r&&r.status==='ok'){await flRefreshContenu();renderAdmin();if(okMsg)toast(t(okMsg));return r;}
  if(r&&r.status==='invalid_session')return null;
  const msg=t(ADM_ERR[r&&r.status]||(isNetErr(r)?'netErr':'saveErr'));
  if(errId&&$(errId))$(errId).textContent=msg;else toast(msg);
  return null;
}
function admBusy(o,on){const b=document.querySelector('#onb [data-o="'+o+'"]');if(b)b.disabled=on;}
function admAction(o){
  if(o==='admAnn'){$('eAnn').textContent='';oGo('o-adm-ann');return true;}
  if(o==='admPlan'){$('ePlan').textContent='';oGo('o-adm-plan');return true;}
  if(o==='admTar'){$('eTar').textContent='';oGo('o-adm-tar');return true;}
  if(o==='admCoach'){coachForm(null);oGo('o-adm-coach');return true;}
  if(o==='coachCancel'){coachForm(null);renderAdmin();return true;}
  if(o==='coachSave'){
    const n=$('cN').value.trim(),na=$('cNa').value.trim(),s=$('cS').value.trim(),sa=$('cSa').value.trim();
    if(!n){$('eCoach').textContent=t('errCoach');return true;}
    if(COACHES.some((c,i)=>i!==coachEdit&&c[0].toLowerCase()===n.toLowerCase())){$('eCoach').textContent=t('errCoachDup');return true;}
    const isNew=coachEdit===null,id=isNew?null:COACHES[coachEdit][5],old=isNew?null:COACHES[coachEdit][0];admBusy('coachSave',true);
    flAdmin('fl_admin_coach_save',{p_id:id,p_nom:n,p_nom_ar:na,p_salle:coachRoom,p_spec:s,p_spec_ar:sa},isNew?'coachAdded':'coachSaved','eCoach').then(r=>{
      admBusy('coachSave',false);if(!r)return;
      if(old&&old!==n)delete CAR[old];if(na)CAR[n]=na;coachForm(null);renderAdmin();
    });
    return true;
  }
  if(o==='admCode'){$('kN').value='';$('kC').value='';$('eCode').textContent='';oGo('o-adm-code');return true;}
  if(o==='codeSave'){
    const k=$('kN').value.trim(),c=$('kC').value.trim();
    const err=!/^\d{4}$/.test(k)?'errCode4':/^(\d)\1{3}$/.test(k)||['1234','4321','0123','9876'].includes(k)?'errCodeWeak':k!==c?'errCodeConf':'';
    if(err){$('eCode').textContent=t(err);return true;}
    $('eCode').textContent='';admBusy('codeSave',true);
    flAdmin('fl_admin_staff_pin',{p_pin:k},'codeSaved','eCode').then(r=>{admBusy('codeSave',false);if(!r)return;$('kN').value='';$('kC').value='';const p=osStack.pop();if(p)oGo(p,false);});
    return true;
  }
  if(o==='admDefi'){flDefiLoad();$('dfOn').checked=DEFI.on;$('dfR').value=DEFI.rew.fr;$('dfRa').value=DEFI.rew.ar;oGo('o-adm-defi');return true;}
  if(o==='defiSave'){flAdmin('fl_admin_defi_set',{p_on:$('dfOn').checked,p_rew_fr:$('dfR').value.trim(),p_rew_ar:$('dfRa').value.trim()},'dfSaved').then(r=>{if(r)flDefiLoad();});return true;}
  if(o==='admExit'){closeAdmin();return true;}
  if(o==='annAdd'){
    const ft=$('annT').value.trim(),fs=$('annS').value.trim(),at=$('annTa').value.trim(),as=$('annSa').value.trim(),end=$('annE').value;
    if(!ft&&!at){$('eAnn').textContent=t('errAnn');return true;}
    if(end&&end<isoAgo(0)){$('eAnn').textContent=t('errAnnEnd');return true;}
    $('eAnn').textContent='';admBusy('annAdd',true);
    flAdmin('fl_admin_annonce_add',{p_type:annType,p_titre_fr:ft,p_texte_fr:fs,p_titre_ar:at,p_texte_ar:as,p_fin:end||null},'annPublished','eAnn').then(r=>{
      admBusy('annAdd',false);if(!r)return;['annT','annS','annTa','annSa','annE'].forEach(id=>$(id).value='');annType='news';renderAdmin();
    });
    return true;
  }
  if(o==='planAdd'){
    const tm=$('pT').value,nm=$('pN').value.trim(),co=$('pC').value.trim();
    if(!/^\d{2}:\d{2}$/.test(tm)||!nm){$('ePlan').textContent=t('errPlan');return true;}
    $('ePlan').textContent='';admBusy('planAdd',true);
    flAdmin('fl_admin_planning_add',{p_jour:admDay,p_heure:tm,p_fin:null,p_cours:nm,p_coach:co,p_tag:$('pK').checked?'kids':null},'planAdded','ePlan').then(r=>{
      admBusy('planAdd',false);if(!r)return;$('pN').value='';$('pC').value='';$('pK').checked=false;renderAdmin();
    });
    return true;
  }
  if(o==='tarSave'){
    const v=[0,1,2,3].map(i=>parseInt($('tp'+i).value,10));
    if(v.some(x=>!(x>0))){$('eTar').textContent=t('errTar');return true;}
    $('eTar').textContent='';admBusy('tarSave',true);
    flAdmin('fl_admin_tarif_set',{p_offre:admOffer,p_sous:admSub,p_prix:v},'tarSaved','eTar').then(r=>{admBusy('tarSave',false);if(r)renderTarifs(true);});
    return true;
  }
  return false;
}

function renderExtras(){

  const closed='<i>'+t('closed')+'</i>';

/* ── Ma série : semaines d'affilée avec au moins un entraînement (la semaine en cours ne casse pas la série) ── */
function streakOf(days){
  const set=new Set(days.map(d=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x);}));
  const w=new Date(weekKey()+'T00:00');if(!set.has(iso(w)))w.setDate(w.getDate()-7);
  let n=0;while(set.has(iso(w))){n++;w.setDate(w.getDate()-7);}
  return n;
}
function renderStreak(){
  const box=$('streak'),a=ACCOUNTS[CUR];if(!box)return;
  if(!a){box.hidden=true;renderDefi();return;}
  box.hidden=false;a.days=a.days||[];
  const today=iso(now()),wk=weekKey(),n=streakOf(a.days),thisN=a.days.filter(d=>d>=wk&&d<=today).length,done=a.days.includes(today);
  const lbl=lang==='ar'?(n===2?t('stWeeks2'):n>=3&&n<=10?t('stWeeksN'):n>10?t('stWeeksB'):t('stWeeks1')):(n>=2?t('stWeeksN'):t('stWeeks1'));
  const sub=thisN?fmt(t('stThis'),{n:sessWord(thisN)}):n?t('stKeep'):t('stZero');
  const mon=new Date(wk+'T00:00');let cells=t('stDays').map(d=>'<span>'+d+'</span>').join('');
  for(let w=4;w>=0;w--)for(let d=0;d<7;d++){
    const x=new Date(mon);x.setDate(x.getDate()-7*w+d);const k=iso(x);
    const cls=(a.days.includes(k)?'on':'')+(k===today?' today':'')+(k>today?' fut':'');
    cells+='<i class="'+cls.trim()+'" title="'+fmtDate(x)+'">'+(a.days.includes(k)?x.getDate():'')+'</i>';
  }
  box.innerHTML='<span class="k">'+t('streakLbl')+'</span>'+
    '<div class="st-top"><div class="st-num"><span class="n">'+n+'</span><b>'+lbl+'</b></div></div>'+
    '<p class="st-sub">'+sub+'</p>'+
    '<div class="st-cal">'+cells+'</div>'+
    (done?'<div class="st-done"><span>'+t('stDone')+'</span><button data-st="undo">'+t('stUndo')+'</button></div>'
         :'<button class="st-btn" data-st="mark">'+(a.sexe==='femme'?t('stBtnF'):t('stBtnH'))+'</button>');
  renderDefi();
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-st]'),a=ACCOUNTS[CUR];if(!b||!a)return;
  const today=iso(now());a.days=a.days||[];ensureWeek(a);
  if(b.dataset.st==='mark'&&!a.days.includes(today)){a.days.push(today);a.week=(a.week||0)+1;toast(t('streakOk'));flSend('fl_mark_today',{},true);}
  if(b.dataset.st==='undo'&&a.days.includes(today)){
    a.days=a.days.filter(d=>d!==today);a.week=Math.max(0,(a.week||0)-1);
    flMe('fl_unmark_today').then(r=>{if(r&&r.status==='from_seance'){a.days.push(today);a.week++;renderStreak();renderSeance();toast(t('fromSeance'));}
      else if(isNetErr(r)){a.days.push(today);a.week++;renderStreak();renderSeance();toast(t('netErr'));}});

});

function shortName(n){const p=String(n||'').trim().split(/\s+/);return p[0]+(p[1]?' '+p[1][0].toUpperCase()+'.':'');}
function monthCount(a){return a.defiMois||0;}   // séances validées par la base ce mois-ci
// Classement calculé par la base (prénom + initiale, rang, « me » pour sa propre ligne)
function defiRows(){return DEFI_ROWS.map(x=>({n:x.nom,c:x.n,me:!!x.me,r:x.rang}));}
async function flDefiLoad(){
  if(!CUR)return;
  const r=await flMe('fl_defi_classement');
  if(r&&r.status==='ok'){DEFI_ROWS=r.rows||[];DEFI={on:r.on!==false,rew:{fr:r.rew_fr||'',ar:r.rew_ar||''}};const a=ACCOUNTS[CUR];if(a){const me=DEFI_ROWS.find(x=>x.me);a.defi=!!me;if(me)a.defiMois=me.n;}renderDefi();if(curOs==='o-adm-defi')renderAdmin();}
}
function rewTxt(){const r=DEFI.rew;return lang==='ar'?(r.ar||r.fr):(r.fr||r.ar);}
function dfRow(r){return '<div class="df-row'+(r.r<=3?' top':'')+(r.me?' me':'')+'"><span class="rk">'+r.r+'</span><span><bdi>'+esc(r.n)+'</bdi>'+(r.me?' · '+t('dfYou'):'')+'</span><span class="ct">'+sessWord(r.c)+'</span></div>';}
function dfMonthName(){return t('months')[now().getMonth()];}
function renderDefi(){
  const box=$('defi'),a=ACCOUNTS[CUR];if(!box)return;
  if(!a||!DEFI.on){box.hidden=true;return;}
  box.hidden=false;
  const n=now(),last=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),left=last-n.getDate();
  const rows=defiRows(),me=rows.find(r=>r.me),rw=rewTxt();
  let body='';
  if(me){
    const above=rows.filter(r=>r.c>me.c),gapRow=above.length?above[above.length-1]:null;
    body='<div class="df-me"><span class="n">'+me.r+(lang==='ar'?'':'<sup>'+(me.r===1?'er':'e')+'</sup>')+'</span><b>'+fmt(t('dfOf'),{n:rows.length})+'<br>'+fmt(t('dfMonthN'),{n:sessWord(me.c)})+'</b></div>'+
      '<p class="df-gap">'+(gapRow?fmt(t('dfGap'),{n:sessWord(gapRow.c-me.c),r:gapRow.r}):t('dfFirst'))+'</p>';
  }else if(a.role==='owner'){
    body='<p class="df-intro">'+t('dfOwner')+'</p>';
  }else{
    body='<p class="df-intro">'+t('dfIntro')+'</p>';
  }
  const top=rows.slice(0,3);
  const list=top.map(dfRow).join('')+(me&&me.r>3?'<div class="df-dots">···</div>'+dfRow(me):'');
  box.innerHTML='<div class="df-h"><span class="k">'+t('defiLbl')+' · '+dfMonthName()+'</span><small>'+(left?fmt(t('dfLeft'),{d:dayWord(left)}):t('dfLastDay'))+'</small></div>'+body+
    (rw?'<div class="df-rew">'+IC_TROPHY+'<span>'+esc(rw)+'</span></div>':'')+
    '<div class="df-list">'+list+'</div>'+
    '<p class="df-note">'+t('dfRuleShort')+'</p>'+
    (!me&&a.role!=='owner'?'<button class="st-btn" data-df="join">'+t('dfJoin')+'</button>':'<button class="df-more" data-df="open">'+t('dfSee')+'</button>');
}
function renderDefiSheet(){
  const rows=defiRows(),me=rows.find(r=>r.me);
